<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シフト連絡</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフト連絡">
<meta name="theme-color" content="#141414">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#efefec;--surface:#fff;--surface-2:#f4f4f1;--ink:#141414;--muted:#5a5a55;--line:#d7d7d2;--soft:#fff2b3;--g:#1a7f47;--g-bg:#e3f3ea;--r:#c02b2b;--r-bg:#fadfdd;--a:#8a5a00;--a-bg:#ffe9b0;--b:#1f5fa8;--b-bg:#dfeaf8}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--surface:#222220;--surface-2:#2c2c29;--ink:#f1f1ec;--muted:#b0b0a8;--line:#44443f;--soft:#5a4d12;--g:#3fae6f;--g-bg:#1d3a2a;--r:#ef6a6a;--r-bg:#4a2222;--a:#f0c060;--a-bg:#4a3a12;--b:#8ab8f0;--b-bg:#1f3350}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.hd{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:64px}
.hd b{font-size:18px;font-weight:900}
.who{margin-left:auto;border:1.5px solid var(--line);background:var(--surface-2);border-radius:99px;min-height:44px;padding:4px 14px;font-weight:700;display:flex;align-items:center;gap:6px;max-width:64%}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.tabs{max-width:640px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr}
.tabs button{border:0;background:none;min-height:46px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.n{background:var(--r);color:#fff;border-radius:99px;font-size:12px;min-width:22px;padding:1px 7px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(48px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:17px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.rule{background:var(--a-bg);color:var(--a);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin:0 0 4px}
.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:16px;min-height:48px;width:100%}
textarea{min-height:88px;resize:vertical;display:block}
.chips{display:grid;gap:6px}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;min-height:48px;font-weight:700;padding:0 4px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.go{border:0;background:var(--g);color:#fff;border-radius:12px;width:100%;min-height:54px;font-size:17px;font-weight:900;margin-top:16px}
.go:disabled{opacity:.5}
.note{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.sec:first-child{margin-top:0}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.row.wait{border:1.5px solid var(--r)}
.row.done .h{opacity:.8}
.h{display:grid;grid-template-columns:58px minmax(0,1fr) auto 18px;gap:10px;align-items:center;padding:10px 12px;min-height:60px;width:100%;border:0;background:none;text-align:left}
.kind{font-weight:900;border-radius:10px;padding:6px 0;text-align:center;background:var(--surface-2);font-size:15px}
.kind.k0{background:var(--a-bg);color:var(--a)}.kind.k1{background:var(--r-bg);color:var(--r)}.kind.k2{background:var(--b-bg);color:var(--b)}
.h b{display:block;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h .d{display:block;font-size:13px;color:var(--muted)}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st.w{background:var(--r);color:#fff}.st.ok{background:var(--g-bg);color:var(--g)}
.ar{color:var(--muted);font-size:13px;text-align:center}
.bd{border-top:1px solid var(--line);padding:12px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.m{max-width:86%;align-self:flex-start}
.m.me{align-self:flex-end;text-align:right}
.m small{display:block;font-size:11px;color:var(--muted);margin:0 4px 2px}
.m span{display:inline-block;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px}
.m.me span{background:var(--soft);border-radius:14px 4px 14px 14px}
.stt{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.stt.w{background:var(--r-bg);color:var(--r)}.stt.ok{background:var(--g-bg);color:var(--g)}
.ack{border:0;background:var(--g);color:#fff;border-radius:10px;width:100%;min-height:48px;font-weight:900;margin-bottom:10px}
.re{display:grid;grid-template-columns:1fr 72px;gap:8px}
.re button{border:1.5px solid var(--ink);background:var(--surface);border-radius:10px;font-weight:700;min-height:48px}
.empty{text-align:center;color:var(--muted);padding:22px}
.load{text-align:center;color:var(--muted);padding:40px 0}
.msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));margin:auto;max-width:560px;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 16px;z-index:9;text-align:center;font-weight:700}
.msg.err{background:var(--r);color:#fff}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
</style></head><body>
<header>
  <div class="hd"><b>シフト連絡</b><button class="who" id="who" type="button" hidden><span id="whoN"></span><small>切り替え</small></button></div>
  <div class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-t="post" aria-selected="true">連絡する</button>
    <button type="button" role="tab" data-t="list" aria-selected="false">届いた連絡<span class="n" id="cnt" hidden></span></button>
  </div>
</header>
<main>
  <div class="load" id="load">読み込んでいます…</div>
  <section class="card" id="passBox" hidden>
    <h2>あなたの合言葉を入れてください</h2>
    <p class="sub">合言葉は、1人ずつ違います。入れると、あなたの名前で開きます。この端末では、次から聞きません。</p>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="合言葉">
    <button class="go" id="passOk" type="button">開く</button>
    <p class="note">合言葉が分からないときは、管理者に聞いてください。<br>急ぎの連絡は、電話でお願いします。</p>
  </section>
  <section class="card" id="stopBox" hidden><h2 id="stopT"></h2><p class="sub" id="stopS" style="margin:0"></p><button class="go" id="retry" type="button">もう一度ためす</button></section>
  <section class="card" id="post" hidden>
    <p class="rule">⏰ 1分でも遅れるときは、必ず連絡。</p>
    <span class="f">何の連絡ですか</span>
    <div class="chips c4" id="kind"><button type="button" aria-pressed="true">遅れ</button><button type="button" aria-pressed="false">休み</button><button type="button" aria-pressed="false">早退</button><button type="button" aria-pressed="false">その他</button></div>
    <span class="f">いつのシフトですか</span>
    <div class="chips c3" id="dayC"><button type="button" aria-pressed="true" data-d="0">今日</button><button type="button" aria-pressed="false" data-d="1">明日</button><button type="button" aria-pressed="false" data-d="x">ほかの日</button></div>
    <input id="day" type="date" aria-label="日付を選ぶ" style="margin-top:8px" hidden>
    <label class="f" for="text">内容（何分遅れるか・理由）</label>
    <textarea id="text" maxlength="300" placeholder="例：電車が遅れて、10分ほど遅れます"></textarea>
    <button class="go" id="send" type="button">受付とチームに送る</button>
    <p class="note">送ると受付にメールが届き、「届いた連絡」に並びます。</p>
  </section>
  <div id="list" hidden></div>
</main>
<div class="msg" id="msg" hidden role="status"></div>
<script>
(function(){
/* データの受け渡し先（Google Apps Script）。合言葉が合わないと、何も返さない */
var API="https://script.google.com/macros/s/AKfycbwHxUMfAHIUZhKsERc2feYzgSH-d0fs_aQax2ypcmaE2MAJN01hAYcA-042XmgXGcGyMg/exec";
var $=function(id){return document.getElementById(id)};
var mem={get:function(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set:function(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}};
var pass=mem.get("sh4.pass"),me="",D=null,busy=false,mt=null,tab="post",stop="",first=true,open={};
var STOP={unset:["いまは使えません","合言葉がまだ設定されていません。管理者に伝えてください。急ぎの連絡は、電話でお願いします。"],wait:["少しお待ちください","合言葉のまちがいが続いたため、15分ほど止めています。急ぎの連絡は、電話でお願いします。"],net:["つながりません","通信できませんでした。電波のよいところで、もう一度おためしください。急ぎの連絡は、電話でお願いします。"]};
var ERR={busy:"連絡が集中しています。少しおいて、もう一度お試しください",text:"内容を書いてください",gone:"その連絡が見つかりません",self:"自分の連絡は、ほかの人が確認します"};
function say(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"");m.hidden=false;clearTimeout(mt);mt=setTimeout(function(){m.hidden=true},err?6000:3500)}
function call(req,ok,quiet){req.pass=pass;busy=true;
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(req),redirect:"follow",credentials:"omit",cache:"no-store",referrerPolicy:"no-referrer"})
  .then(function(res){if(!res.ok)throw new Error("http");return res.json()})
  .then(function(r){busy=false;first=false;$("send").disabled=false;
    if(!r||!r.ok){var c=r&&r.code;
      if(c==="unset"||c==="wait"){D=null;stop=c;show();return}
      if(c==="pass"){stop="";D=null;if(pass)say("合言葉が違います",true);pass="";mem.set("sh4.pass","");show();$("pass").value="";return}
      say(ERR[c]||"うまくいきませんでした。もう一度お試しください",true);return}
    D=r;me=r.me;stop="";mem.set("sh4.pass",pass);if(r.newId)open[r.newId]=true;show();if(ok)ok()})
  .catch(function(){busy=false;$("send").disabled=false;
    if(first||!D){first=false;D=null;stop="net";show();return}
    if(!quiet)say("通信できませんでした。少しおいて、もう一度お試しください",true)})}
function san(n){return n+"さん"}
function hm(iso){var m=String(iso||"").match(/T(\d{2}):(\d{2})/);return m?Number(m[1])+":"+m[2]:""}
function md(iso){var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?Number(m[2])+"/"+Number(m[3]):""}
function fmt(iso){return md(iso)+" "+hm(iso)}
function addDay(d,n){var m=d.match(/^(\d{4})-(\d{2})-(\d{2})$/);return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+n)).toISOString().slice(0,10)}
function dayLabel(d){var m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return "日付なし";var w=["日","月","火","水","木","金","土"][new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()];
  var p=d===D.today?"今日 ":d===addDay(D.today,1)?"明日 ":d<D.today?"過ぎた日（まだ確認されていません） ":"";return p+Number(m[2])+"/"+Number(m[3])+"("+w+")"}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
/* いま出す画面を1つに決める：読み込み中 → 合言葉 → 連絡する／届いた連絡 */
function show(){
  var loading=first&&!!pass&&!D&&!stop,needPass=!D&&!loading,ready=!!D;
  $("load").hidden=!loading;
  $("stopBox").hidden=!(needPass&&stop);if(stop){$("stopT").textContent=STOP[stop][0];$("stopS").textContent=STOP[stop][1]}
  $("passBox").hidden=!needPass||!!stop;
  $("tabs").hidden=!ready;$("who").hidden=!ready;$("post").hidden=!ready||tab!=="post";$("list").hidden=!ready||tab!=="list";
  if(!ready)return;
  $("whoN").textContent=san(me);
  [].forEach.call($("tabs").children,function(b){b.setAttribute("aria-selected",String(b.dataset.t===tab))});
  var n=D.threads.filter(function(t){return !t.seenAt&&t.name!==me}).length;
  $("cnt").hidden=!n;$("cnt").textContent=n;
  drawList()}
/* 開いておく連絡：ほかの人の確認待ち、自分がいま送った連絡、自分で開いた連絡。あとは閉じておく */
function isOpen(t){return open[t.id]!=null?open[t.id]:(!t.seenAt&&t.name!==me)}
function drawList(){
  var box=$("list"),keep={},a=document.activeElement,foc=a&&a.dataset?a.dataset.re:null;
  [].forEach.call(box.querySelectorAll("input[data-re]"),function(i){if(i.value)keep[i.dataset.re]=i.value});
  box.innerHTML="";
  if(!D.threads.length){box.appendChild(el("div","card empty","いま出ている連絡はありません"))}
  var days={},order=[];
  D.threads.forEach(function(t){var k=t.day||"";if(!days[k]){days[k]=[];order.push(k)}days[k].push(t)});
  order.sort();
  order.forEach(function(k){box.appendChild(el("div","sec",dayLabel(k)));
    days[k].sort(function(x,y){return (x.seenAt?1:0)-(y.seenAt?1:0)||(x.at<y.at?1:-1)}).forEach(card)});
  box.appendChild(el("p","note","対象の日が過ぎた連絡は、ここには出ません（記録は残ります）"));
  function card(t){var mine=t.name===me,op=isOpen(t),c=el("section","row "+(t.seenAt?"done":"wait"));
    var h=el("button","h"),ki=["遅れ","休み","早退"].indexOf(t.kind);h.type="button";h.setAttribute("aria-expanded",String(op));
    h.appendChild(el("span","kind"+(ki>=0?" k"+ki:""),t.kind));
    var mid=el("span");mid.appendChild(el("b",null,mine?"あなた":san(t.name)));
    mid.appendChild(el("span","d",(t.at.slice(0,10)===t.day?hm(t.at):fmt(t.at))+" に連絡"+(t.msgs.length?"・返信"+t.msgs.length+"件":"")));h.appendChild(mid);
    h.appendChild(el("span","st "+(t.seenAt?"ok":"w"),t.seenAt?"確認済み":"確認待ち"));
    h.appendChild(el("span","ar",op?"▲":"▼"));
    h.onclick=function(){open[t.id]=!op;drawList()};c.appendChild(h);
    if(!op){box.appendChild(c);return}
    var bd=el("div","bd");
    var ms=el("div","msgs");[{by:t.name,at:t.at,text:t.text}].concat(t.msgs).forEach(function(m){var mm=m.by===me,d=el("div","m"+(mm?" me":""));
      d.appendChild(el("small",null,(mm?"あなた":san(m.by))+"　"+fmt(m.at)));d.appendChild(el("span",null,m.text));ms.appendChild(d)});bd.appendChild(ms);
    if(t.seenAt)bd.appendChild(el("div","stt ok","✓ "+(t.seenBy===me?"あなた":san(t.seenBy))+"が確認しました（"+fmt(t.seenAt)+"）"));
    else if(mine)bd.appendChild(el("div","stt w","⏳ まだ確認されていません。確認されると、ここに名前が出ます"));
    else{var b=el("button","ack","✓ "+san(t.name)+"の連絡を確認しました");b.type="button";b.onclick=function(){open[t.id]=true;act({a:"seen",id:t.id},"確認済みにしました")};bd.appendChild(b)}
    var re=el("div","re"),inp=el("input"),ph=mine?"追加で伝える":san(t.name)+"に返信する";inp.maxLength=300;inp.placeholder=ph;inp.setAttribute("aria-label",ph);inp.dataset.re=t.id;if(keep[t.id])inp.value=keep[t.id];
    var rb=el("button",null,"送る");rb.type="button";rb.onclick=function(){var v=inp.value.trim();if(!v){inp.focus();return}open[t.id]=true;act({a:"reply",id:t.id,text:v},"送りました",function(){inp.value=""})};
    inp.addEventListener("keydown",function(e){if(e.isComposing||e.keyCode===229)return;if(e.key==="Enter"){e.preventDefault();rb.click()}});
    re.appendChild(inp);re.appendChild(rb);bd.appendChild(re);c.appendChild(bd);box.appendChild(c);if(foc===t.id)inp.focus()}}
function act(req,okMsg,after){if(busy)return;if(after)after();call(req,function(){say(okMsg)})}
function press(box,b){[].forEach.call(box.children,function(c){c.setAttribute("aria-pressed",String(c===b))})}
$("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;show();window.scrollTo(0,0);if(tab==="list"&&!busy)call({a:"list"},null,true)};
$("who").onclick=function(){pass="";me="";D=null;open={};mem.set("sh4.pass","");$("pass").value="";tab="post";show();$("pass").focus()};
$("kind").onclick=function(e){var b=e.target.closest("button");if(b)press(this,b)};
$("dayC").onclick=function(e){var b=e.target.closest("button");if(!b)return;press(this,b);var x=b.dataset.d==="x";$("day").hidden=!x;if(x){if(!$("day").value)$("day").value=addDay(D.today,2);$("day").min=D.today;$("day").focus()}};
$("send").onclick=function(){var t=$("text").value.trim();if(!t){$("text").focus();say("内容を書いてください",true);return}
  var k=$("kind").querySelector('[aria-pressed="true"]'),d=$("dayC").querySelector('[aria-pressed="true"]').dataset.d;
  var day=d==="x"?$("day").value:addDay(D.today,Number(d));
  if(d==="x"&&!day){$("day").focus();say("日付を選んでください",true);return}
  if(busy)return;this.disabled=true;
  call({a:"post",kind:k.textContent,day:day,text:t},function(){$("text").value="";tab="list";show();window.scrollTo(0,0);say("送りました。受付にメールが届きます")})};
$("passOk").onclick=function(){var v=$("pass").value.trim();if(!v){$("pass").focus();return}if(busy)return;pass=v;call({a:"list"})};
$("pass").addEventListener("keydown",function(e){if(e.key==="Enter")$("passOk").click()});
$("retry").onclick=function(){stop="";first=true;show();if(pass)call({a:"list"})};
show();
if(pass)call({a:"list"});
setInterval(function(){if(!document.hidden&&!busy&&D)call({a:"list"},null,true)},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!busy&&D)call({a:"list"},null,true)});
})();
</script></body></html>
